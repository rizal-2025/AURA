name: AURA demo cleanup

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated Neon environment to clean
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: aura-demo-maintenance-${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || vars.AURA_DEMO_CLEANUP_SCHEDULE_ENABLED == 'true'
    environment: ${{ github.event_name == 'schedule' && 'production' || inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Verify latest default-branch SHA
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$DEFAULT_BRANCH")"

      - name: Set up exact Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12.7'
          cache: pip

      - name: Install the pinned dependency set
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps -r requirements.txt
          python -m pip check

      - name: Run one bounded cleanup pass
        shell: bash
        env:
          APP_ENV: demo
          DEMO_DATABASE_URL: ${{ secrets.NEON_MAINTENANCE_DATABASE_URL }}
          SQL_ECHO: 'false'
        run: python -m app.jobs.demo_cleanup --once --batch-size 100
