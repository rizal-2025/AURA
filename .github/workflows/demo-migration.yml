name: AURA demo controlled migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Isolated Neon environment
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
      operation:
        description: Metadata-only plan or approved empty-schema application
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply-empty-schema
      approved_sha:
        description: Required exact 40-hex default-branch SHA for apply
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aura-demo-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migration:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Verify approved latest default-branch SHA
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH"
          DEFAULT_SHA="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          test "$(git rev-parse HEAD)" = "$DEFAULT_SHA"
          if [ "$OPERATION" = 'apply-empty-schema' ]; then
            [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$APPROVED_SHA" = "$DEFAULT_SHA"
          fi

      - name: Set up exact Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12.7'
          cache: pip

      - name: Install the pinned dependency set
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --no-deps -r requirements.txt
          python -m pip check

      - name: Classify schema without reading row data
        shell: bash
        env:
          APP_ENV: demo
          DEMO_DATABASE_URL: ${{ secrets.NEON_MAINTENANCE_DATABASE_URL }}
          SQL_ECHO: 'false'
        run: python -m app.jobs.demo_schema --operation plan

      - name: Apply additive empty-database schema
        if: inputs.operation == 'apply-empty-schema'
        shell: bash
        env:
          APP_ENV: demo
          DEMO_DATABASE_URL: ${{ secrets.NEON_MAINTENANCE_DATABASE_URL }}
          SQL_ECHO: 'false'
        run: python -m app.jobs.demo_schema --operation apply-empty-schema

      - name: Verify schema metadata
        if: inputs.operation == 'apply-empty-schema'
        shell: bash
        env:
          APP_ENV: demo
          DEMO_DATABASE_URL: ${{ secrets.NEON_MAINTENANCE_DATABASE_URL }}
          SQL_ECHO: 'false'
        run: python -m app.jobs.demo_schema --operation verify
