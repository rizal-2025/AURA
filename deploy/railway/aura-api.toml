[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host :: --port ${PORT} --workers 1 --no-access-log --timeout-graceful-shutdown 25"
numReplicas = 1
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
overlapSeconds = 0
drainingSeconds = 30
